name: fetch-neoforged-artifacts

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - 'status/**'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Download
        id: dl
        continue-on-error: true
        run: |
          mkdir -p out
          : > out/_download.log
          ok=1
          base="https://maven.neoforged.net/releases"

          fetch() {
            coord="$1"
            g=$(echo "$coord" | cut -d: -f1)
            a=$(echo "$coord" | cut -d: -f2)
            v=$(echo "$coord" | cut -d: -f3)
            path=$(echo "$g" | tr '.' '/')/$a/$v
            echo "== $coord" >> out/_download.log
            for ext in pom jar module sol; do
              name="$a-$v.$ext"
              code=$(curl -sSL --connect-timeout 15 -m 300 -o "out/$name" -w '%{http_code}' "$base/$path/$name" 2>/dev/null || echo ERR)
              size=$(stat -c%s "out/$name" 2>/dev/null || echo 0)
              if [ "$code" = "200" ] && [ "$size" -gt 0 ]; then
                echo "  OK  $name size=$size" >> out/_download.log
              else
                echo "  --  $name http=$code" >> out/_download.log
                rm -f "out/$name"
              fi
            done
          }

          fetch "net.neoforged:neoform-runtime:2.0.31"
          if [ -f coords.txt ]; then
            grep -vE '^[[:space:]]*#' coords.txt | grep -vE '^[[:space:]]*$' | while read -r c; do fetch "$c"; done
          fi

          echo "ALL_OK=$ok" >> out/_download.log
          sha256sum out/*.jar out/*.pom out/*.module 2>/dev/null > out/SHA256SUMS.txt || true
          echo "ok=$ok" >> "$GITHUB_OUTPUT"

      - name: Report status to repo
        if: always()
        run: |
          mkdir -p status
          cp out/_download.log status/last-run.log 2>/dev/null || echo "no log" > status/last-run.log
          {
            echo "run: ${{ github.run_id }}"
            echo "time: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "ok: ${{ steps.dl.outputs.ok }}"
            echo "---"
            cat status/last-run.log
          } > status/summary.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status
          git commit -m "status: update run report [skip ci]" || echo "no changes"
          git push || echo "push failed"

      - name: Publish release assets
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          if ! ls out/*.jar >/dev/null 2>&1; then echo "no jar, skip release"; exit 0; fi
          TAG="artifacts-$(date -u +%Y%m%d-%H%M%S)"
          find out -maxdepth 1 -type f ! -name '_download.log' -print0 | xargs -0 gh release create "$TAG" \
            --title "NeoForged artifacts $TAG" \
            --notes "由 coords.txt 驱动的构件离线备份"
          echo "release: $TAG"
