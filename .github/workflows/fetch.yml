name: fetch-neoforged-artifacts

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - 'status/**'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Download from neoforged
        continue-on-error: true
        run: |
          : > log.txt
          base="https://maven.neoforged.net/releases"

          probe() {
            u="$1"
            code=$(curl -sSL --connect-timeout 15 -m 60 -o probe.out -w '%{http_code}' "$u" 2>/dev/null || echo ERR)
            size=$(stat -c%s probe.out 2>/dev/null || echo 0)
            echo "PROBE $code $size $u" >> log.txt
            if [ "$code" = "200" ]; then head -c 300 probe.out >> log.txt; echo "" >> log.txt; fi
          }

          probe "$base/net/neoforged/minecraft-dependencies/"
          probe "$base/net/neoforged/minecraft-dependencies/maven-metadata.xml"
          probe "$base/net/neoforged/minecraft-dependencies/1.20.1/"
          probe "$base/net/neoforged/minecraft-dependencies/1.21.1/"

          if [ -f paths.txt ]; then
            grep -vE '^[[:space:]]*#' paths.txt | grep -vE '^[[:space:]]*$' | while read -r p; do
              mkdir -p "repo/$(dirname "$p")"
              code=$(curl -sSL --connect-timeout 15 -m 300 -o "repo/$p" -w '%{http_code}' "$base/$p" 2>/dev/null || echo ERR)
              size=$(stat -c%s "repo/$p" 2>/dev/null || echo 0)
              if [ "$code" = "200" ] && [ "$size" -gt 0 ]; then
                echo "OK $p $size" >> log.txt
              else
                rm -f "repo/$p"
                echo "MISS $p code=$code" >> log.txt
              fi
            done
          fi
          if [ -d repo ]; then (cd repo && find . -type f | sort > ../repo-files.txt); fi
          if [ -d repo ]; then (cd repo && xargs -a ../repo-files.txt sha256sum > ../SHA256SUMS.txt) 2>/dev/null || true; fi
          zip -qr repo.zip repo 2>/dev/null || echo "zip skipped" >> log.txt
          ls -l repo.zip >> log.txt 2>/dev/null || true

      - name: Publish release
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="artifacts-$(date -u +%Y%m%d-%H%M%S)"
          echo "tag=$TAG" > release.log
          if [ -f repo.zip ]; then
            gh release create "$TAG" repo.zip SHA256SUMS.txt repo-files.txt \
              --title "NeoForged repo mirror $TAG" \
              --notes "可解压到本地 Maven 仓库的镜像包" >> release.log 2>&1
            echo "rc=$?" >> release.log
          else
            echo "no repo.zip" >> release.log
          fi

      - name: Report status
        if: always()
        run: |
          mkdir -p status
          cp log.txt status/last-run.log 2>/dev/null || echo none > status/last-run.log
          cp release.log status/last-release.log 2>/dev/null || echo none > status/last-release.log
          { echo "run: ${{ github.run_id }}"; echo "time: $(date -u +%Y-%m-%dT%H:%M:%SZ)"; echo "--- download ---"; cat status/last-run.log; echo "--- release ---"; cat status/last-release.log; } > status/summary.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status
          git commit -m "status: update run report [skip ci]" || echo "no changes"
          git push || echo "push failed"
